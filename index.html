<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMDI PHOTOGRAPHY | التصوير الاحترافي</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: { 400: '#FFD700', 500: '#D4AF37', 600: '#AA8C2C' }, dark: { 900: '#050505', 800: '#121212', 700: '#1E1E1E' } },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'], playfair: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased">

    <!-- شاشة الترحيب (Splash Screen) بالإضاءة -->
    <div id="splash-screen" class="fixed inset-0 bg-dark-900 z-[9999] flex flex-col items-center justify-center transition-opacity duration-1000">
        <h1 class="text-4xl md:text-6xl font-playfair font-bold gold-text-gradient tracking-widest animate-pulse mb-4 drop-shadow-[0_0_15px_rgba(212,175,55,0.6)]">HAMDI PHOTOGRAPHY</h1>
        <div class="w-24 h-1 bg-gold-500 rounded-full animate-bounce shadow-[0_0_10px_rgba(212,175,55,0.8)]"></div>
    </div>

    <!-- القائمة العلوية -->
    <nav id="navbar" class="fixed w-full z-50 transition-all duration-300 py-4 top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <a href="#" class="font-playfair text-2xl md:text-3xl font-bold tracking-widest text-gold-500 hover:text-gold-400">HAMDI PHOTOGRAPHY</a>
            <div class="hidden md:flex space-x-8 space-x-reverse">
                <a href="#home" class="text-gray-300 hover:text-gold-500 font-semibold">الرئيسية</a>
                <a href="#about" class="text-gray-300 hover:text-gold-500 font-semibold">من أنا</a>
                <a href="#services" class="text-gray-300 hover:text-gold-500 font-semibold">خدماتي</a>
                <a href="#contact" class="text-gray-300 hover:text-gold-500 font-semibold">تواصل معي</a>
            </div>
        </div>
    </nav>

    <!-- الأقسام الأساسية (أضف أقسامك هنا كالسابق) -->
    <section id="home" class="relative h-screen flex items-center justify-center">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-black opacity-70"></div>
        </div>
        <div class="relative z-10 text-center px-4 max-w-4xl mx-auto">
            <h1 class="text-5xl md:text-7xl font-bold font-playfair mb-6 gold-text-gradient uppercase leading-tight">HAMDI PHOTOGRAPHY</h1>
            <p class="text-lg md:text-2xl text-gray-300 mb-10 font-light">نحول لحظاتكم الثمينة إلى لوحات سينمائية خالدة</p>
        </div>
    </section>

    <!-- واجهة المساعد الذكي المربوط بجيميني -->
    <div id="ai-chat-widget" class="fixed bottom-6 left-6 z-50">
        <div id="chat-box" class="hidden bg-dark-900 border border-gold-500 rounded-lg w-80 shadow-[0_0_20px_rgba(212,175,55,0.2)] overflow-hidden flex-col mb-4">
            <div class="bg-gold-500 text-dark-900 font-bold p-4 flex justify-between items-center">
                <div class="flex items-center gap-2"><i class="fas fa-robot text-xl"></i><span>مساعد HAMDI الذكي</span></div>
                <button id="close-chat" class="text-dark-900 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div id="chat-messages" class="p-4 h-64 overflow-y-auto flex flex-col gap-3 bg-dark-800 text-sm">
                <div class="bg-dark-700 text-gray-200 p-3 rounded-lg rounded-tr-none self-start w-10/12 leading-relaxed border border-dark-600">
                    مرحباً! أنا الذكاء الاصطناعي الخاص بالمصور حمدي. اسألني أي شيء عن الخدمات، المعدات، أو المواعيد.
                </div>
            </div>
            <div class="p-3 bg-dark-900 border-t border-dark-700 flex gap-2">
                <input type="text" id="chat-input" placeholder="اكتب استفسارك..." class="flex-1 bg-dark-800 text-white px-3 py-2 rounded border border-dark-700 focus:border-gold-500 focus:outline-none">
                <button id="send-chat" class="bg-gold-500 text-dark-900 px-4 py-2 rounded hover:bg-gold-400"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        
        <button id="chat-toggle" class="w-14 h-14 bg-gold-500 rounded-full shadow-[0_0_25px_rgba(212,175,55,0.7)] flex items-center justify-center text-dark-900 hover:bg-gold-400 hover:scale-110 transition-transform relative border-2 border-yellow-300">
            <i class="fas fa-comment-dots text-2xl"></i>
            <span class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
            <span class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full border border-dark-900"></span>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
